name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Portability
        run: scripts/check_portability.sh
      - name: Artifact structure
        run: python3 scripts/check_repo.py
      - name: Generated index
        run: python3 scripts/gen_index.py --check
      - name: Changelog format
        run: python3 scripts/check_changelog.py
      - name: Relative links
        run: python3 scripts/check_links.py
      - name: Prompt mirror
        run: python3 scripts/check_mirror.py
      - name: Checks have tests
        run: tests/run_tests.sh

  overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Judge configuration
        id: config
        env:
          KEY: ${{ secrets.TOOLKIT_JUDGE_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TOOLKIT_JUDGE_API_KEY is empty, so no artifact is judged."
          fi
      - name: Overlap with published artifacts
        if: steps.config.outputs.configured == 'true'
        env:
          TOOLKIT_JUDGE_BASE_URL: ${{ vars.TOOLKIT_JUDGE_BASE_URL }}
          TOOLKIT_JUDGE_MODEL: ${{ vars.TOOLKIT_JUDGE_MODEL }}
          TOOLKIT_JUDGE_API_KEY: ${{ secrets.TOOLKIT_JUDGE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/check_overlap.py --all
          else
            python3 scripts/check_overlap.py --added-since "${{ github.event.pull_request.base.sha || github.event.before }}"
          fi
