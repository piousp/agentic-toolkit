name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Portability
        run: scripts/check_portability.sh
      - name: Artifact structure
        run: python3 scripts/check_repo.py
      - name: Generated index
        run: python3 scripts/gen_index.py --check
      - name: Changelog format
        run: python3 scripts/check_changelog.py
      - name: Relative links
        run: python3 scripts/check_links.py
      - name: Prompt mirror
        run: python3 scripts/check_mirror.py
      - name: Checks have tests
        run: tests/run_tests.sh
